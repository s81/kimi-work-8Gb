name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref, a push to a busy PR should not queue builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The whole build is `tcc -run build.c`: one C file, run by the Tiny C Compiler, on
  # both platforms. Every test here runs WITHOUT model weights. That is deliberate: the
  # checkpoint is 1.56 TB, so correctness has to be verifiable without it or it will not
  # be verified.
  build-and-test:
    name: build + test (${{ matrix.os }}, tcc)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tcc

      # build.c compiles with -Wall -Werror, so a TCC warning fails this step.
      - name: tcc -run build.c test
        shell: bash
        run: |
          set -o pipefail
          tcc -run build.c test 2>&1 | tee "$RUNNER_TEMP/test.log"

      # Guard against a suite that passes because it silently ran nothing.
      - name: Assert the suite was not silently empty
        shell: bash
        run: |
          grep -q "22 passed, 0 failed, 0 skipped"                 "$RUNNER_TEMP/test.log"
          grep -q "SCALE TEST PASSED"                              "$RUNNER_TEMP/test.log"
          grep -q "VERDICT: ENGINE MATCHES THE REFERENCE EXACTLY"  "$RUNNER_TEMP/test.log"
          grep -q "ALL WEIGHTLESS TESTS PASSED"                    "$RUNNER_TEMP/test.log"

      # The release zip for this platform, so every run has a downloadable build.
      - name: tcc -run build.c dist
        shell: bash
        run: tcc -run build.c dist

      - uses: actions/upload-artifact@v7
        with:
          name: k3-${{ runner.os }}-x64
          path: dist/*.zip
          if-no-files-found: error

  python-lint:
    name: python tools lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install --quiet ruff==0.16.3
      # The Python tools are optional extras (fixture generators, reference checks);
      # nothing in the build needs them. They are still linted so they keep working.
      - run: ruff check tools/ --output-format=github
      - name: Syntax check every tool
        run: python -m compileall -q tools/

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends shellcheck
      # benchmarks/ is included deliberately. Its scripts run unattended for hours and
      # record whatever they observe as a result, so a quoting or pipefail defect there
      # does not crash, it produces a plausible-looking table of wrong numbers.
      - run: find scripts examples benchmarks -name '*.sh' -print0 | xargs -0 -r shellcheck -S warning
